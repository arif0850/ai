<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Second Test Post | Md. Ariful Islam</title>
  <meta name="description" content="Hello, this is my second test post.  Testing if the bot detects it now!...">
  <meta name="author" content="Md. Ariful Islam">
  
  <meta property="og:type" content="article">
  <meta property="og:title" content="Second Test Post">
  <meta property="og:description" content="Hello, this is my second test post.  Testing if the bot detects it now!...">
  <meta property="og:url" content="https://www.hiarif.com/posts/second-test-post.html">
  <meta property="og:image" content="https://www.hiarif.com/assets/images/og-image.png">
  
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Second Test Post">
  
  <meta name="theme-color" content="#121212">
  
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    :root {
      --bg-main: #121212;
      --bg-card: #1e1e1e;
      --bg-inner: #232323;
      --accent: #ffdb6e;
      --text-main: #ffffff;
      --text-soft: #e5e5e5;
      --text-muted: #a3a3a3;
      --border: #2f2f2f;
      --radius-md: 14px;
      --radius-lg: 20px;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      line-height: 1.7;
      padding: 40px 20px 100px;
      min-height: 100vh;
      letter-spacing: -0.01em;
    }
    
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--accent);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 30px;
      transition: all 0.3s ease;
    }
    
    .back-link:hover {
      transform: translateX(-4px);
    }
    
    .post-header {
      margin-bottom: 40px;
      padding-bottom: 30px;
      border-bottom: 1px solid var(--border);
    }
    
    .post-date {
      font-size: 0.75rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-weight: 700;
      margin-bottom: 12px;
    }
    
    .post-title {
      font-size: 2.2rem;
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -0.03em;
      color: var(--text-main);
    }
    
    .post-content {
      font-size: 1.05rem;
      color: var(--text-soft);
    }
    
    .post-content p {
      margin-bottom: 20px;
      line-height: 1.8;
    }
    
    .post-content h2 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
      margin: 32px 0 16px;
      letter-spacing: -0.02em;
    }
    
    .post-content h3 {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-main);
      margin: 24px 0 12px;
    }
    
    .post-content ul {
      margin: 16px 0 20px 24px;
    }
    
    .post-content li {
      margin-bottom: 8px;
      color: var(--text-soft);
    }
    
    .post-content strong {
      color: var(--text-main);
      font-weight: 700;
    }
    
    .post-content a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.3s ease;
    }
    
    .post-content a:hover {
      border-bottom-color: var(--accent);
    }
    
    .post-image {
      margin: 24px 0;
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px solid var(--border);
    }
    
    .post-image img {
      width: 100%;
      height: auto;
      display: block;
    }
    
    .post-footer {
      margin-top: 50px;
      padding-top: 30px;
      border-top: 1px solid var(--border);
      text-align: center;
    }
    
    .post-footer a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--accent);
      color: #121212;
      padding: 12px 24px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.9rem;
      transition: all 0.3s ease;
    }
    
    .post-footer a:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(255, 219, 110, 0.3);
    }
    
    @media (max-width: 640px) {
      body { padding: 24px 16px 80px; }
      .post-title { font-size: 1.6rem; }
      .post-content { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="../blog.html" class="back-link">
      <i class="fa-solid fa-arrow-left"></i> Back to Blog
    </a>
    
    <article>
      <header class="post-header">
        <div class="post-date">October 08, 2026</div>
        <h1 class="post-title">Second Test Post</h1>
      </header>
      
      
      
      <div class="post-content">
        <p>Hello, this is my second test post.</p>
<p>Testing if the bot detects it now!</p>
      </div>
    </article>
    
    <footer class="post-footer">
      <a href="../blog.html">
        <i class="fa-solid fa-book-open"></i> Read More Posts
      </a>
    </footer>
  </div>
</body>
</html>
