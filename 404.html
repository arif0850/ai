<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Md. Ariful Islam</title>
  <meta name="description" content="The page you're looking for doesn't exist. Return to the homepage or explore my portfolio.">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#121212">
  
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    :root {
      --bg-main: #121212;
      --bg-card: #1e1e1e;
      --bg-inner: #232323;
      --accent: #ffdb6e;
      --accent-soft: rgba(255, 219, 110, 0.12);
      --accent-line: rgba(255, 219, 110, 0.25);
      --text-main: #ffffff;
      --text-soft: #e5e5e5;
      --text-muted: #a3a3a3;
      --text-dim: #737373;
      --border: #2f2f2f;
      --border-soft: #262626;
      --radius-md: 14px;
      --radius-lg: 20px;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      letter-spacing: -0.01em;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      position: relative;
    }
    
    /* Background glow effect */
    body::before {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(
        circle at center,
        rgba(255, 219, 110, 0.06) 0%,
        transparent 50%
      );
      pointer-events: none;
      z-index: 0;
    }
    
    .error-container {
      position: relative;
      z-index: 1;
      max-width: 600px;
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-lg);
      padding: 60px 40px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      animation: fadeInUp 0.6s ease;
    }
    
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .error-code {
      font-size: 8rem;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.06em;
      background: linear-gradient(135deg, var(--accent) 0%, #ffc94a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 16px;
      text-shadow: 0 0 60px rgba(255, 219, 110, 0.2);
    }
    
    .error-icon {
      font-size: 3rem;
      color: var(--accent);
      margin-bottom: 24px;
      opacity: 0.9;
    }
    
    .error-title {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.025em;
      margin-bottom: 16px;
      line-height: 1.2;
    }
    
    .error-message {
      font-size: 1rem;
      color: var(--text-muted);
      line-height: 1.7;
      margin-bottom: 36px;
      max-width: 460px;
      margin-left: auto;
      margin-right: auto;
    }
    
    .error-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 32px;
    }
    
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.3s ease;
      min-width: 160px;
    }
    
    .btn-primary {
      background: var(--accent);
      color: #121212;
      border: 1px solid var(--accent);
    }
    
    .btn-primary:hover {
      background: #ffd84a;
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(255, 219, 110, 0.3);
    }
    
    .btn-outline {
      background: transparent;
      color: var(--text-main);
      border: 1px solid var(--border);
    }
    
    .btn-outline:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-2px);
    }
    
    .suggestions {
      padding-top: 32px;
      border-top: 1px solid var(--border-soft);
    }
    
    .suggestions-title {
      font-size: 0.72rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-weight: 700;
      margin-bottom: 16px;
    }
    
    .suggestion-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }
    
    .suggestion-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: var(--bg-inner);
      border: 1px solid var(--border-soft);
      border-radius: 999px;
      color: var(--text-soft);
      font-size: 0.78rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.3s ease;
    }
    
    .suggestion-link:hover {
      border-color: var(--accent-line);
      color: var(--accent);
      background: var(--accent-soft);
    }
    
    .suggestion-link i {
      font-size: 0.7rem;
      color: var(--accent);
    }
    
    @media (max-width: 640px) {
      .error-container {
        padding: 40px 24px;
      }
      
      .error-code {
        font-size: 5.5rem;
      }
      
      .error-icon {
        font-size: 2.2rem;
      }
      
      .error-title {
        font-size: 1.35rem;
      }
      
      .error-message {
        font-size: 0.92rem;
      }
      
      .btn {
        width: 100%;
        max-width: 280px;
      }
      
      .error-actions {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>
<body>

  <div class="error-container">
    
    <div class="error-icon">
      <i class="fa-solid fa-compass"></i>
    </div>
    
    <div class="error-code">404</div>
    
    <h1 class="error-title">Page Not Found</h1>
    
    <p class="error-message">
      The page you're looking for doesn't exist or has been moved. 
      It may have been removed, renamed, or never existed.
    </p>
    
    <div class="error-actions">
      <a href="/" class="btn btn-primary">
        <i class="fa-solid fa-house"></i>
        Back to Home
      </a>
      <a href="/blog.html" class="btn btn-outline">
        <i class="fa-solid fa-book-open"></i>
        Visit Blog
      </a>
    </div>
    
    <div class="suggestions">
      <div class="suggestions-title">Explore Portfolio</div>
      <div class="suggestion-links">
        <a href="/#about" class="suggestion-link">
          <i class="fa-solid fa-user"></i> About
        </a>
        <a href="/#resume" class="suggestion-link">
          <i class="fa-solid fa-file-lines"></i> Resume
        </a>
        <a href="/#portfolio" class="suggestion-link">
          <i class="fa-solid fa-briefcase"></i> Skills
        </a>
        <a href="/#contact" class="suggestion-link">
          <i class="fa-solid fa-envelope"></i> Contact
        </a>
      </div>
    </div>
    
  </div>

</body>
</html>
