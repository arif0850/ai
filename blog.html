<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog | Md. Ariful Islam</title>
  <meta name="description" content="Field notes from the pharmaceutical production floor — practical lessons, observations, and reflections by Md. Ariful Islam.">
  <meta name="author" content="Md. Ariful Islam">
  
  <meta property="og:type" content="website">
  <meta property="og:title" content="Blog | Md. Ariful Islam">
  <meta property="og:description" content="Field notes from the pharmaceutical production floor.">
  <meta property="og:url" content="https://www.hiarif.com/blog.html">
  <meta property="og:image" content="https://www.hiarif.com/assets/images/og-image.png">
  
  <meta name="theme-color" content="#121212">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    :root {
      --bg-main: #121212;
      --bg-card: #1e1e1e;
      --bg-inner: #232323;
      --accent: #ffdb6e;
      --accent-soft: rgba(255, 219, 110, 0.12);
      --accent-line: rgba(255, 219, 110, 0.25);
      --text-main: #ffffff;
      --text-soft: #e5e5e5;
      --text-muted: #a3a3a3;
      --text-dim: #737373;
      --border: #2f2f2f;
      --border-soft: #262626;
      --radius-md: 14px;
      --radius-lg: 20px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      line-height: 1.6;
      padding: 40px 20px 100px;
      min-height: 100vh;
      letter-spacing: -0.01em;
      -webkit-font-smoothing: antialiased;
    }
    
    .container { max-width: 1000px; margin: 0 auto; }
    
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--accent);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 30px;
      transition: var(--transition);
    }
    .back-link:hover { transform: translateX(-4px); }
    
    .page-header {
      margin-bottom: 30px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border-soft);
    }
    
    .page-title {
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 10px;
    }
    
    .page-subtitle {
      color: var(--text-muted);
      font-size: 1rem;
      line-height: 1.6;
    }
    
    /* ====================================
       Category Filter Bar
       ==================================== */
    .category-bar {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 30px;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .category-bar::-webkit-scrollbar { display: none; }
    
    .cat-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      background: var(--bg-inner);
      border: 1px solid var(--border-soft);
      border-radius: 999px;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap;
      flex-shrink: 0;
    }
    
    .cat-pill:hover {
      border-color: var(--accent-line);
      color: var(--accent);
    }
    
    .cat-pill.active {
      background: var(--accent);
      color: #121212;
      border-color: var(--accent);
    }
    
    .cat-pill i { font-size: 0.85rem; }
    
    .cat-count {
      display: inline-block;
      background: rgba(255, 255, 255, 0.1);
      padding: 1px 8px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 700;
    }
    
    .cat-pill.active .cat-count {
      background: rgba(0, 0, 0, 0.15);
    }
    
    /* ====================================
       Posts Grid
       ==================================== */
    .posts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }
    
    .post-card {
      display: flex;
      flex-direction: column;
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-lg);
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      transition: var(--transition);
    }
    
    .post-card:hover {
      border-color: var(--accent-line);
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    }
    
    .post-thumb {
      height: 180px;
      background: linear-gradient(135deg, #232323 0%, #1a1a1a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    
    .post-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }
    
    .post-card:hover .post-thumb img {
      transform: scale(1.05);
    }
    
    .post-thumb-placeholder {
      color: var(--accent);
      font-size: 2.5rem;
      opacity: 0.4;
    }
    
    .post-cat-tag {
      position: absolute;
      top: 14px;
      left: 14px;
      background: rgba(18, 18, 18, 0.9);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--accent-line);
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    
    .post-body {
      padding: 22px;
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 10px;
    }
    
    .post-date {
      font-size: 0.7rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 700;
    }
    
    .post-card-title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.015em;
      line-height: 1.35;
      color: var(--text-main);
    }
    
    .post-excerpt {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.65;
      flex: 1;
    }
    
    .post-read {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 600;
      margin-top: 6px;
    }
    
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }
    
    .empty-state i {
      font-size: 3rem;
      color: var(--text-dim);
      margin-bottom: 16px;
      display: block;
    }
    
    .loading {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }
    
    @media (max-width: 640px) {
      body { padding: 24px 16px 80px; }
      .page-title { font-size: 1.8rem; }
      .posts-grid { grid-template-columns: 1fr; gap: 16px; }
      .cat-pill { padding: 8px 14px; font-size: 0.78rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="back-link">
      <i class="fa-solid fa-arrow-left"></i> Back to Portfolio
    </a>

    <header class="page-header">
      <h1 class="page-title">Field Notes</h1>
      <p class="page-subtitle">
        Practical lessons, observations, and reflections from the pharmaceutical production floor.
      </p>
    </header>

    <div class="category-bar" id="categoryBar">
      <!-- Loaded by JS -->
    </div>

    <div class="posts-grid" id="postsGrid">
      <div class="loading">
        <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 2rem; margin-bottom: 12px; display: block;"></i>
        Loading posts...
      </div>
    </div>
  </div>

  <script>
    // ========================================
    // BLOG CONFIG
    // ========================================
    const CONFIG = {
      postsIndex: 'scripts/posts-index.json',
      categories: 'scripts/categories.json'
    };

    let allPosts = [];
    let categories = [];
    let activeCategory = 'all';

    // ========================================
    // LOAD DATA
    // ========================================
    async function loadData() {
      try {
        const [postsRes, catsRes] = await Promise.all([
          fetch(CONFIG.postsIndex),
          fetch(CONFIG.categories)
        ]);
        
        const postsData = await postsRes.json();
        const catsData = await catsRes.json();
        
        allPosts = postsData.posts || [];
        categories = catsData.categories || [];
        
        // Sort posts by date (newest first)
        allPosts.sort((a, b) => new Date(b.date) - new Date(a.date));
        
        renderCategories();
        renderPosts();
        
      } catch (err) {
        console.error('Load error:', err);
        document.getElementById('postsGrid').innerHTML = `
          <div class="empty-state">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <p>পোস্ট লোড করা যায়নি। পরে আবার চেষ্টা করুন।</p>
          </div>
        `;
      }
    }

    // ========================================
    // CATEGORIES
    // ========================================
    function renderCategories() {
      const bar = document.getElementById('categoryBar');
      const totalCount = allPosts.length;
      
      let html = `
        <button class="cat-pill active" data-cat="all">
          <i class="fa-solid fa-layer-group"></i>
          All Posts
          <span class="cat-count">${totalCount}</span>
        </button>
      `;
      
      categories.forEach(cat => {
        const count = allPosts.filter(p => p.category === cat.id).length;
        if (count === 0 && cat.id !== 'notes') return; // skip empty cats (except notes)
        
        html += `
          <button class="cat-pill" data-cat="${cat.id}">
            <i class="fa-solid ${cat.icon}"></i>
            ${cat.name}
            <span class="cat-count">${count}</span>
          </button>
        `;
      });
      
      bar.innerHTML = html;
      
      bar.querySelectorAll('.cat-pill').forEach(pill => {
        pill.addEventListener('click', () => {
          bar.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
          pill.classList.add('active');
          activeCategory = pill.getAttribute('data-cat');
          renderPosts();
        });
      });
    }

    // ========================================
    // POSTS
    // ========================================
    function getCategory(id) {
      return categories.find(c => c.id === id) || {
        id: 'notes',
        name: 'Field Notes',
        icon: 'fa-pen-fancy',
        color: '#a78bfa'
      };
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text || '';
      return div.innerHTML;
    }

    function formatDate(iso) {
      const d = new Date(iso);
      return d.toLocaleDateString('en-US', {
        year: 'numeric',
        month: 'short',
        day: 'numeric'
      });
    }

    function renderPosts() {
      const grid = document.getElementById('postsGrid');
      
      let filtered = allPosts;
      if (activeCategory !== 'all') {
        filtered = allPosts.filter(p => p.category === activeCategory);
      }
      
      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <i class="fa-solid fa-inbox"></i>
            <p>এই ক্যাটেগরিতে এখনো কোনো পোস্ট নেই।</p>
          </div>
        `;
        return;
      }
      
      grid.innerHTML = filtered.map(post => {
        const cat = getCategory(post.category);
        const imgSrc = post.image 
          ? (post.image.startsWith('http') ? post.image : post.image)
          : '';
        
        const thumbContent = imgSrc
          ? `<img src="${imgSrc}" alt="${escapeHtml(post.title)}" loading="lazy">`
          : `<i class="fa-solid ${cat.icon} post-thumb-placeholder"></i>`;
        
        return `
          <a href="posts/${post.slug}.html" class="post-card">
            <div class="post-thumb">
              ${thumbContent}
              <span class="post-cat-tag">${escapeHtml(cat.name)}</span>
            </div>
            <div class="post-body">
              <div class="post-date">${formatDate(post.date)}</div>
              <h2 class="post-card-title">${escapeHtml(post.title)}</h2>
              <p class="post-excerpt">${escapeHtml(post.excerpt)}</p>
              <span class="post-read">
                Read article <i class="fa-solid fa-arrow-right"></i>
              </span>
            </div>
          </a>
        `;
      }).join('');
    }

    // ========================================
    // INIT
    // ========================================
    loadData();
  </script>
</body>
</html>
