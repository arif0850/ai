name: Telegram Blog Bot

on:
  schedule:
    # প্রতি ১০ মিনিটে চেক করবে
    - cron: '*/10 * * * *'
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write

jobs:
  check-telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run blog bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/blog_bot.py

      - name: Commit state file
        run: |
          git config --local user.email "bot@hiarif.com"
          git config --local user.name "Blog Bot"
          git add scripts/blog-state.json scripts/posts-index.json sitemap.xml || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Update blog bot state [skip ci]" || true
          git pull --rebase origin main || true
          git push origin main || true
