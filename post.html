  <script

  </script>
  
  <style>
    /* --- CSS Variables --- */
    :root {
      --primary: #0F172A;
      --primary-light: #1E293B;
      --accent: #0D9488;
      --accent-light: #CCFBF1;
      --text-main: #0F172A;
      --text-muted: #64748B;
      --text-light: #94A3B8;
      --bg-main: #FFFFFF;
      --bg-alt: #F8FAFC;
      --bg-card: #FFFFFF;
      --border: #E2E8F0;
      --border-light: #F1F5F9;
      --font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --transition: all 0.25s ease;
      --letter-tight: -0.025em;
      --letter-snug: -0.015em;
      --letter-normal: -0.01em;
      --letter-wide: 0.12em;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    /* --- Base & Reset --- */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    
    html, body {
      overflow-x: hidden;
      width: 100%;
      max-width: 100%;
    }
    
    body {
      font-family: var(--font-family);
      font-size: 16px;
      line-height: 1.7;
      color: var(--text-main);
      background-color: var(--bg-main);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      letter-spacing: var(--letter-normal);
      font-feature-settings: "cv02", "cv03", "cv04", "cv11";
      font-optical-sizing: auto;
      position: relative;
    }

    .container { 
      width: 100%; 
      max-width: 780px; 
      margin: 0 auto; 
      padding: 0 1.5rem;
    }

    /* --- Header --- */
    header {
      position: sticky; 
      top: 0; 
      z-index: 100;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }
    
    .nav-container { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      height: 72px; 
      max-width: 1140px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }
    
    .logo { 
      display: flex; 
      align-items: center; 
      gap: 0.75rem; 
      text-decoration: none;
    }
    
    .logo-icon {
      width: 38px; 
      height: 38px; 
      background: var(--accent); 
      color: white;
      border-radius: 8px; 
      display: flex; 
      align-items: center; 
      justify-content: center;
      font-weight: 800; 
      font-size: 0.95rem;
      letter-spacing: var(--letter-tight);
    }
    
    .logo-text { display: flex; flex-direction: column; }
    .logo-text span:first-child { 
      font-weight: 700; 
      font-size: 0.95rem; 
      color: var(--primary); 
      line-height: 1.2;
      letter-spacing: var(--letter-snug);
    }
    .logo-text span:last-child { 
      font-size: 0.62rem; 
      color: var(--text-muted); 
      letter-spacing: 0.08em; 
      text-transform: uppercase;
      font-weight: 600;
    }
    
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--accent);
      text-decoration: none;
      transition: var(--transition);
    }
    
    .back-link:hover { 
      gap: 0.65rem; 
    }

    /* ========================================
       ARTICLE
       ======================================== */
    .article-wrapper {
      padding: 3.5rem 0 4rem;
    }
    
    .article-meta {
      font-size: 0.75rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 700;
      margin-bottom: 1rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    
    .article-meta::before {
      content: '';
      width: 24px;
      height: 2px;
      background: var(--accent);
    }
    
    .article-title {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--primary);
      line-height: 1.2;
      letter-spacing: -0.03em;
      margin-bottom: 1.5rem;
    }
    
    .article-summary {
      font-size: 1.1rem;
      color: var(--text-muted);
      line-height: 1.65;
      margin-bottom: 2rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid var(--border);
      font-weight: 400;
    }
    
    .article-image {
      width: 100%;
      max-height: 440px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 2.5rem;
      background: var(--bg-alt);
      box-shadow: var(--shadow-md);
      display: block;
    }
    
    /* ========================================
       ARTICLE BODY — Typography
       ======================================== */
    .article-body {
      font-size: 1.05rem;
      color: var(--text-muted);
      line-height: 1.85;
    }
    
    .article-body p {
      margin-bottom: 1.5rem;
    }
    
    .article-body p:last-child {
      margin-bottom: 0;
    }
    
    .article-body h2 {
      font-size: 1.6rem;
      color: var(--primary);
      margin: 2.5rem 0 1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.3;
    }
    
    .article-body h2:first-child {
      margin-top: 0;
    }
    
    .article-body h3 {
      font-size: 1.25rem;
      color: var(--primary);
      margin: 2rem 0 0.85rem;
      font-weight: 700;
      letter-spacing: -0.015em;
      line-height: 1.35;
    }
    
    .article-body ul,
    .article-body ol {
      margin: 0 0 1.5rem 1.5rem;
      color: var(--text-muted);
    }
    
    .article-body li {
      margin-bottom: 0.65rem;
      padding-left: 0.25rem;
      line-height: 1.7;
    }
    
    .article-body li::marker {
      color: var(--accent);
    }
    
    .article-body a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      border-bottom: 1px solid rgba(13, 148, 136, 0.3);
      transition: var(--transition);
    }
    
    .article-body a:hover {
      border-bottom-color: var(--accent);
    }
    
    .article-body strong {
      color: var(--primary);
      font-weight: 700;
    }
    
    .article-body em {
      font-style: italic;
      color: var(--primary);
    }
    
    .article-body blockquote {
      border-left: 3px solid var(--accent);
      padding: 0.5rem 0 0.5rem 1.5rem;
      margin: 1.75rem 0;
      font-size: 1.05rem;
      color: var(--primary);
      font-style: italic;
    }
    
    .article-body code {
      background: var(--bg-alt);
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      font-size: 0.9em;
      color: var(--primary);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    
    .article-body hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 2.5rem 0;
    }
    
    /* ========================================
       POST FOOTER
       ======================================== */
    .post-footer {
      margin-top: 3.5rem;
      padding-top: 2.5rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }
    
    .post-footer .back-link {
      font-size: 0.85rem;
    }

    /* ========================================
       STATES: Loading, Empty, Error
       ======================================== */
    .state-box {
      text-align: center;
      padding: 5rem 2rem;
    }
    
    .state-box svg {
      width: 64px;
      height: 64px;
      margin: 0 auto 1.5rem;
      fill: var(--text-light);
      opacity: 0.5;
      display: block;
    }
    
    .state-box h2 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 0.75rem;
      letter-spacing: -0.02em;
    }
    
    .state-box p {
      font-size: 0.95rem;
      color: var(--text-muted);
      max-width: 400px;
      margin: 0 auto 1.75rem;
      line-height: 1.65;
    }
    
    /* Loading spinner */
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1.5rem;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* --- Footer --- */
    footer {
      background: var(--bg-alt);
      color: var(--text-muted);
      padding: 2rem 0; 
      font-size: 0.82rem;
      border-top: 1px solid var(--border);
    }
    
    .footer-content { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      flex-wrap: wrap; 
      gap: 1rem;
      max-width: 1140px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }
    
    .footer-content a {
      color: var(--text-muted);
      text-decoration: none;
      transition: var(--transition);
    }
    
    .footer-content a:hover {
      color: var(--accent);
    }

    /* --- Responsive --- */
    @media (max-width: 767px) {
      .article-wrapper { padding: 2.5rem 0 3rem; }
      .article-title { font-size: 1.75rem; letter-spacing: -0.02em; }
      .article-summary { font-size: 1rem; padding-bottom: 1.5rem; }
      .article-body { font-size: 1rem; line-height: 1.8; }
      .article-body h2 { font-size: 1.35rem; margin: 2rem 0 0.85rem; }
      .article-body h3 { font-size: 1.1rem; }
      .article-image { max-height: 280px; margin-bottom: 1.75rem; }
      .post-footer { 
        flex-direction: column; 
        align-items: flex-start;
        margin-top: 2.5rem;
        padding-top: 2rem;
      }
      .footer-content { flex-direction: column; text-align: center; }
    }
    
    @media (max-width: 480px) {
      .article-title { font-size: 1.5rem; }
      .article-body h2 { font-size: 1.2rem; }
      .state-box { padding: 3rem 1.5rem; }
    }
    
    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="index.html" class="logo">
        <div class="logo-icon">AI</div>
        <div class="logo-text">
          <span>Md. Ariful Islam</span>
          <span>Pharma Manufacturing</span>
        </div>
      </a>
      <a href="blog.html" class="back-link">← All Posts</a>
    </div>
  </header>

  <main>
    <article class="article-wrapper">
      <div class="container" id="article-container">
        <!-- Loading state shown initially -->
        <div class="state-box">
          <div class="spinner"></div>
          <p style="color: var(--text-muted); font-size: 0.92rem;">Loading post...</p>
        </div>
      </div>
    </article>
  </main>

  <footer>
    <div class="footer-content">
      <p>&copy; <span id="year"></span> Md. Ariful Islam. All rights reserved.</p>
      <a href="index.html">← Back to Home</a>
    </div>
  </footer>

  <script>
    // ========================================
    // SINGLE POST LOGIC
    // ========================================
    document.getElementById('year').textContent = new Date().getFullYear();

    // Parse URL query parameter
    const params = new URLSearchParams(window.location.search);
    const postId = params.get('id');

    if (!postId) {
      showState(
        'No post specified',
        'The link you followed does not include a valid post ID.',
        'post-not-found'
      );
    } else {
      loadPost(postId);
    }

    function loadPost(id) {
      fetch('content/blogs.json')
        .then(res => {
          if (!res.ok) throw new Error('Failed to fetch blogs.json');
          return res.json();
        })
        .then(data => {
          const posts = data.posts || [];
          const post = posts.find(p => String(p.id) === String(id));
          
          if (!post) {
            showState(
              'Post not found',
              'The post you are looking for may have been removed or the link is incorrect.',
              'post-not-found'
            );
            return;
          }
          
          renderPost(post);
        })
        .catch(err => {
          console.error('Failed to load post:', err);
          showState(
            'Unable to load post',
            'There was a problem loading this post. Please try again later.',
            'error'
          );
        });
    }

    function renderPost(post) {
      // Update page title
      document.title = (post.title || 'Blog Post') + ' | Md. Ariful Islam';
      
      // Update meta description
      const metaDesc = document.querySelector('meta[name="description"]');
      if (metaDesc && post.summary) {
        metaDesc.setAttribute('content', post.summary);
      }
      
      // Update OG tags
      updateMeta('og:title', post.title || 'Blog Post');
      if (post.summary) updateMeta('og:description', post.summary);
      if (post.image) updateMeta('og:image', post.image);
      
      // Format date
      const dateObj = new Date(post.date || Date.now());
      const formattedDate = dateObj.toLocaleDateString('en-US', { 
        year: 'numeric', 
        month: 'long', 
        day: 'numeric' 
      });
      
      // Format content
      const contentHtml = formatContent(post.content || '');
      
      // Fallback image
      const fallbackImg = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4MDAiIGhlaWdodD0iNDAwIiB2aWV3Qm94PSIwIDAgODAwIDQwMCI+PHJlY3Qgd2lkdGg9IjgwMCIgaGVpZ2h0PSI0MDAiIGZpbGw9IiNmMWY1ZjkiLz48dGV4dCB4PSI1MCUiIHk9IjUwJSIgZG9taW5hbnQtYmFzZWxpbmU9Im1pZGRsZSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC1mYW1pbHk9IkFyaWFsLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMjQiIGZpbGw9IiM5NGEzYjgiPkZpZWxkIE5vdGVzPC90ZXh0Pjwvc3ZnPg==';
      
      const container = document.getElementById('article-container');
      container.innerHTML = `
        <span class="article-meta">${formattedDate}</span>
        <h1 class="article-title">${escapeHtml(post.title || 'Untitled')}</h1>
        ${post.summary ? `<p class="article-summary">${escapeHtml(post.summary)}</p>` : ''}
        ${post.image ? `<img src="${escapeHtml(post.image)}" alt="${escapeHtml(post.title)}" class="article-image" onerror="this.onerror=null; this.src='${fallbackImg}'">` : ''}
        <div class="article-body">${contentHtml}</div>
        <div class="post-footer">
          <a href="blog.html" class="back-link">← All Posts</a>
          <a href="index.html#contact" class="back-link">Contact Me →</a>
        </div>
      `;
      
      // Scroll to top
      window.scrollTo({ top: 0, behavior: 'instant' });
    }

    // ========================================
    // CONTENT FORMATTER
    // Supports:
    //   ## Heading 2
    //   ### Heading 3
    //   **bold**
    //   *italic*
    //   [text](url)
    //   - list item
    //   1. numbered list
    //   > blockquote
    //   --- horizontal rule
    //   `inline code`
    // ========================================
    function formatContent(text) {
      if (!text) return '';
      
      // Split into blocks by double newlines
      const blocks = text.split(/\n\s*\n/);
      
      return blocks.map(block => {
        block = block.trim();
        if (!block) return '';
        
        // Horizontal rule
        if (/^---+$/.test(block)) {
          return '<hr>';
        }
        
        // Heading 2
        if (block.startsWith('## ')) {
          return `<h2>${formatInline(escapeHtml(block.slice(3)))}</h2>`;
        }
        
        // Heading 3
        if (block.startsWith('### ')) {
          return `<h3>${formatInline(escapeHtml(block.slice(4)))}</h3>`;
        }
        
        // Blockquote
        if (block.startsWith('> ')) {
          const quoteText = block.slice(2).split('\n').map(l => l.replace(/^>\s?/, '')).join(' ');
          return `<blockquote>${formatInline(escapeHtml(quoteText))}</blockquote>`;
        }
        
        // Unordered list
        const lines = block.split('\n').map(l => l.trim()).filter(Boolean);
        const isUnorderedList = lines.every(l => /^[-*]\s/.test(l));
        if (isUnorderedList) {
          const items = lines.map(l => 
            `<li>${formatInline(escapeHtml(l.slice(2)))}</li>`
          ).join('');
          return `<ul>${items}</ul>`;
        }
        
        // Ordered list
        const isOrderedList = lines.every(l => /^\d+\.\s/.test(l));
        if (isOrderedList) {
          const items = lines.map(l => 
            `<li>${formatInline(escapeHtml(l.replace(/^\d+\.\s/, '')))}</li>`
          ).join('');
          return `<ol>${items}</ol>`;
        }
        
        // Regular paragraph
        // Join lines with <br> so single newlines are respected
        const paragraph = lines
          .map(line => formatInline(escapeHtml(line)))
          .join('<br>');
        
        return `<p>${paragraph}</p>`;
      }).join('');
    }

    // Inline formatting: bold, italic, links, code
    function formatInline(text) {
      // Inline code: `code`
      text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
      
      // Bold: **text**
      text = text.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
      
      // Italic: *text* (but not ** already handled)
      text = text.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
      
      // Links: [text](url)
      text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, 
        '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
      
      return text;
    }

    // ========================================
    // HELPERS
    // ========================================
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function updateMeta(property, content) {
      let el = document.querySelector(`meta[property="${property}"]`);
      if (!el) {
        el = document.createElement('meta');
        el.setAttribute('property', property);
        document.head.appendChild(el);
      }
      el.setAttribute('content', content);
    }

    function showState(title, message, type) {
      const container = document.getElementById('article-container');
      
      let iconSvg = '';
      if (type === 'post-not-found') {
        iconSvg = '<svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-1 4l-2.5 3L18 13v5H6v-5l2.5-3L6 7h12zm-2 8h-8v1h8v-1z"/></svg>';
      } else {
        iconSvg = '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>';
      }
      
      container.innerHTML = `
        <div class="state-box">
          ${iconSvg}
          <h2>${escapeHtml(title)}</h2>
          <p>${escapeHtml(message)}</p>
          <a href="blog.html" class="back-link">← Back to all posts</a>
        </div>
      `;
    }
  </script>
