backend:
  name: git-gateway
  branch: main # আপনার গিটহাব ব্রাঞ্চের নাম main না হয়ে master হলে সেটি দিন

# Identity API Connection Fix for Custom Domain
site_url: https://hiarif.com
display_url: https://hiarif.com

media_folder: "assets/blog"
public_folder: "/assets/blog"

collections:
  - name: "blog"
    label: "Blog Posts"
    label_singular: "Blog Post"
    description: "Manage all blog posts shown on the website"
    files:
      - name: "posts"
        label: "All Blog Posts"
        file: "content/blogs.json"
        fields:
          - label: "Blog Posts"
            name: "posts"
            label_singular: "Post"
            widget: "list"
            summary: "{{fields.title}} — {{fields.date}}"
            fields:
              - { label: "ID", name: "id", widget: "string", hint: "Unique identifier (e.g., 1, 2, 3)" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Publish Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
              - { label: "Featured Image", name: "image", widget: "image", required: false, hint: "Recommended size: 800x500" }
              - { label: "Summary", name: "summary", widget: "text", hint: "Short preview text shown on the blog card" }
              - { label: "Content", name: "content", widget: "text", hint: "Full blog content. Use blank lines to create new paragraphs." }
